name: Build (Amazon Linux 2023)

# Builds a multi-arch (amd64/arm64) gwlbtun Docker image via the Dockerfile,
# which compiles gwlbtun inside an amazonlinux:2023 container so the linked
# glibc matches the Amazon Linux hosts this handler runs on.
#
# The image is pushed to ghcr.io/lyoung-confluent/gwlbtun, tagged with the
# commit SHA, only for pushes to `main`. Other triggers (PRs, manual runs)
# still build the image for validation, without pushing it.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      boost_version:
        description: 'Boost release version (headers only)'
        required: false
        default: '1.83.0'

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BOOST_VERSION=${{ inputs.boost_version || '1.83.0' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/lyoung-confluent/gwlbtun:${{ github.sha }}
